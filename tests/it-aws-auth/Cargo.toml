[package]
name = "it-aws-auth"
description = "Integration tests for AWS credential loading and SigV4 signing."
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-aws-auth = { path = "../../crates/ra-aws-auth", features = ["test-api"] }
ra-http = { path = "../../crates/ra-http" }
aws-config = "1"
aws-credential-types = "1"
bytes = "1"
http = "1"
tokio = { version = "1", features = ["full"] }
