# cargo-deny：依赖审计（R0-6）。
#
# 查四件事：已知漏洞、许可证、重复版本与来源。跑法：
#   cargo deny check all
#
# 判据不是「越严越好」，而是**每一条拒绝都要有人能处理**。因此重复版本只 warn
# （传递依赖的版本收敛不由我们决定），而未知来源与通配版本直接 deny（那两件都是
# 自己写出来的）。

[graph]
all-features = true

[advisories]
version = 2
# 撤回的版本不给用：它被撤回通常正是因为有问题。
yanked = "deny"
# starlark 0.14.2 引入的四条（ra-execpolicy 解析规则文件用），是「不再维护」告警而非漏洞，
# 也是 codex 自己 deny.toml 里同样忽略的四条（codex 因 execpolicy 用同一版本 starlark）。逐条按 ID
# 忽略，不放宽到其他告警；starlark 上游去掉对应依赖、升级之后撤销该条。2026-10-09 由维护者明确允许。
# 技能 frontmatter 使用 Codex 同版本 serde_yaml，以保留其 YAML 与修复错误语义；
# Codex 815ef9bbc47bef3bde9cfceaaaf3ef74bb43d052 的 codex-rs/deny.toml 同样精确忽略
# RUSTSEC-2024-0449。没有修复版；这只是停止维护告警，不放宽其他依赖或已知漏洞。
# 2026-10-23 由维护者明确接受本条精确例外；退出 serde_yaml/unsafe-libyaml 后撤销。
# ra-network-proxy 固定的 rama 0.3.0-alpha.4（rama-dns / rama-tcp）带入 hickory-proto 0.25.2 的两条，
# 与 Codex 815ef9bbc47bef3bde9cfceaaaf3ef74bb43d052 的 codex-rs/deny.toml 同样逐条忽略：DNSSEC 特性未开启，
# 0118 没有修复版，0119 的修复在 0.26.1 而 rama 尚未跟进。2026-10-30 由维护者明确接受；rama 升级到
# hickory 0.26.1 或 hickory-net 后撤销。
# 同一 rama 0.3.0-alpha.4 的 rama-core 依赖 tokio-graceful 0.2.2，后者只在 `cfg(loom)` 下依赖
# loom 0.7.2 -> pin-utils 0.1.1；常规构建从不编译它。这是「不再维护」告警，没有修复版。
# 2026-11-10 由维护者明确接受本条精确例外；rama 升级去掉 tokio-graceful/loom 后撤销。
# 同一 hickory-proto 0.25.2 的另外四条修复都在 0.26.2，rama-dns 0.3.0-alpha.4 锁在 hickory 0.25。
# 0487/0489/0490 只影响 zone 文件文本格式的解析，代理解析走 DNS 报文格式，不经过这些路径；
# 0491 是报文解码按报头计数预分配，恶意 DNS 响应可致内存耗尽，代理解析域名时可达。
# 固定版 Codex 同样停在 rama alpha.4 + hickory 0.25.2。2026-11-11 由维护者明确接受这四条精确例外；
# rama 升级到 0.4（hickory-resolver 0.26.1+）或 hickory-proto >=0.26.2 后撤销。
ignore = [
    { id = "RUSTSEC-2026-0487", reason = "Maintainer explicitly accepted this exact exception on 2026-11-11. hickory-proto 0.25.2 via rama-dns 0.3.0-alpha.4 used by ra-network-proxy; the panic is in SVCB/HTTPS text (zone file) parsing, which DNS resolution does not use; fixed in 0.26.2, which rama 0.3 cannot take; remove when rama moves to hickory 0.26.2+" },
    { id = "RUSTSEC-2026-0489", reason = "Maintainer explicitly accepted this exact exception on 2026-11-11. hickory-proto 0.25.2 via rama-dns 0.3.0-alpha.4 used by ra-network-proxy; the panic is in SVCB/HTTPS text (zone file) parameter unquoting, which DNS resolution does not use; fixed in 0.26.2; remove when rama moves to hickory 0.26.2+" },
    { id = "RUSTSEC-2026-0490", reason = "Maintainer explicitly accepted this exact exception on 2026-11-11. hickory-proto 0.25.2 via rama-dns 0.3.0-alpha.4 used by ra-network-proxy; the assertion is in the zone file lexer, which DNS resolution does not use; fixed in 0.26.2; remove when rama moves to hickory 0.26.2+" },
    { id = "RUSTSEC-2026-0491", reason = "Maintainer explicitly accepted this exact exception on 2026-11-11. hickory-proto 0.25.2 via rama-dns 0.3.0-alpha.4 used by ra-network-proxy; message decoding preallocates from header counts, so a malicious DNS response can exhaust memory during proxy resolution; fixed in 0.26.2, which rama 0.3 cannot take; remove when rama moves to hickory 0.26.2+" },
    { id = "RUSTSEC-2026-0441", reason = "Maintainer explicitly accepted this exact exception on 2026-11-10. pin-utils 0.1.1 is unmaintained with no safe upgrade; it is reached only through rama-core 0.3.0-alpha.4 -> tokio-graceful 0.2.2 -> loom 0.7.2, a cfg(loom)-only dependency never compiled in normal builds; remove when rama drops tokio-graceful/loom" },
    { id = "RUSTSEC-2026-0118", reason = "Maintainer explicitly accepted this exact exception on 2026-10-30. hickory-proto 0.25.2 is pulled in via rama-dns/rama-tcp 0.3.0-alpha.4 used by ra-network-proxy; DNSSEC features are not enabled; Codex deny.toml ignores the same advisory; remove when rama updates to hickory 0.26.1 or hickory-net" },
    { id = "RUSTSEC-2026-0119", reason = "Maintainer explicitly accepted this exact exception on 2026-10-30. hickory-proto 0.25.2 is pulled in via rama-dns/rama-tcp 0.3.0-alpha.4 used by ra-network-proxy; no fixed rama release is available yet; Codex deny.toml ignores the same advisory; remove when rama updates to hickory 0.26.1 or hickory-net" },
    { id = "RUSTSEC-2024-0449", reason = "Maintainer explicitly accepted this exact exception on 2026-10-23. Ported Codex skill parser uses serde_yaml 0.9.34 -> unsafe-libyaml 0.2.11; upstream Codex has this same unmaintained advisory exception, with no patched release; remove when the port migrates off this parser" },
    { id = "RUSTSEC-2024-0388", reason = "derivative 不再维护；依赖链 ra-execpolicy -> starlark / starlark_syntax 0.14.2 -> derivative 2.2.0；codex deny.toml 同样忽略；starlark 去掉它后撤销" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash 不再维护；依赖链 ra-execpolicy -> starlark 0.14.2 -> starlark_map 0.14.2 -> fxhash 0.2.1；codex deny.toml 同样忽略；starlark_map 去掉它后撤销" },
    { id = "RUSTSEC-2024-0436", reason = "paste 不再维护；依赖链 ra-execpolicy -> starlark 0.14.2 -> paste 1.0.15；codex deny.toml 同样忽略；starlark 去掉它后撤销" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill 不再维护；依赖链 ra-execpolicy -> starlark / starlark_map / starlark_syntax 0.14.2 -> pagable 0.4.2 -> postcard 1.1.3 -> heapless 0.7.17 -> atomic-polyfill 1.0.3；codex deny.toml 同样忽略；上游去掉它后撤销" },
]

[licenses]
version = 2
# 允许的许可证。新增依赖若不在此列，CI 会失败并要求显式决定——
# 许可证是法律问题，不该由一次顺手的 `cargo add` 悄悄引入。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # bzip2 自己的许可证（BSD 式、宽松）。经由 libbz2-rs-sys（纯 Rust 移植）进来，
    # ra-sandbox 解 bzip2 压缩的归档要用它（R8-P7）。2026-09-29 由维护者明确允许。
    "bzip2-1.0.6",
    # MIT 去掉署名要求的版本（OSI 认可，比 MIT 更宽松）。经 ra-core -> jsonschema 0.58.6 ->
    # referencing -> fluent-uri 0.4.1 -> borrow-or-share 0.2.4 进来（R1-16 结构化输出的 schema 校验）。
    # 2026-10-17 由维护者明确允许。
    "MIT-0",
]
confidence-threshold = 0.8

# 按 crate 放行、不进全局白名单：这三个只经 starlark 0.14.2（ra-execpolicy）进来，codex 的 deny.toml 为同一
# 依赖树全局允许了 BSL-1.0 与 Zlib，这里只放行这三个 crate。2026-10-09 由维护者明确允许；starlark 去掉
# 对应依赖后撤销。
[[licenses.exceptions]]
# ra-execpolicy -> starlark 0.14.2 -> rustyline 14.0.0 -> clipboard-win 5.4.1（只在 Windows 上编译）
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
# ra-execpolicy -> starlark 0.14.2 -> rustyline 14.0.0 -> clipboard-win 5.4.1 -> error-code 3.4.0
crate = "error-code"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
# ra-execpolicy -> starlark / starlark_map / starlark_syntax 0.14.2 -> allocative / pagable -> hashbrown 0.16.1 -> foldhash 0.2.0
crate = "foldhash"
allow = ["Zlib"]

# ra-paths / ra-filesystem / ra-coding -> dirs 6.0.0 -> dirs-sys 0.5.0 -> option-ext 0.2.0（用户主目录定位）。
# codex 的 deny.toml 全局允许 MPL-2.0；这里只放行这一个 crate 的这一个版本，不进全局白名单。
# 2026-10-27 由维护者明确允许；dirs-sys 换掉它或版本变化时重新决定。
[[licenses.exceptions]]
crate = "option-ext@0.2.0"
allow = ["MPL-2.0"]

# ra-network-proxy -> rama-http / rama-http-headers 0.3.0-alpha.4 -> const_format 0.2.35
# （-> const_format_proc_macros 0.2.34）。版本与 Codex 815ef9bbc47bef3bde9cfceaaaf3ef74bb43d052 的
# Cargo.lock 一致；0.2.36 起 konst / konst_macro_rules 变为必选依赖，故锁在上游版本。Codex 的
# deny.toml 全局允许 Zlib，这里只放行这两个 crate 的这两个版本。2026-10-30 由维护者明确允许；
# 版本变化时重新决定。
[[licenses.exceptions]]
crate = "const_format@0.2.35"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "const_format_proc_macros@0.2.34"
allow = ["Zlib"]

[bans]
# 重复版本只警告：传递依赖的版本收敛不在我们控制之内，报错会让 CI 长期红着，
# 而长期红着的门禁等于没有门禁。
multiple-versions = "warn"
# 通配版本是自己写出来的，没有借口。
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
