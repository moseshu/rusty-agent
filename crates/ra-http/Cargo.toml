[package]
name = "ra-http"
description = "Route-aware HTTP and WebSocket transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
test-api = []

[dependencies]
ra-tls = { workspace = true }
data-encoding = "2"
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body = "1"
httpdate = { workspace = true }
native-tls = "0.2"
opentelemetry = "0.31"
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "http2"] }
rustls = { workspace = true, features = ["aws-lc-rs"] }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.32"
url = { workspace = true }
zstd = "0.14.3"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
rustls-platform-verifier = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
