[package]
name = "it-model"
description = "ra-model 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-session = { path = "../../crates/ra-session" }
ra-core = { path = "../../crates/ra-core" }
ra-model = { path = "../../crates/ra-model", features = ["compat", "anthropic"] }
# The conversation session driven by the runner.
ra-runtime = { path = "../../crates/ra-runtime" }
async-trait = "0.1"
futures = "0.3"
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
wiremock = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
