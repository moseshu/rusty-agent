[package]
name = "it-network-proxy"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ra-config = { path = "../../crates/ra-config" }
ra-paths = { path = "../../crates/ra-paths" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
globset = "0.4"
http = "1"
tracing = "0.1"
pretty_assertions = "1"

tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
time = "0.3"
base64 = "0.22"
rand = "0.9"
regex = "1"
sha2 = "0.10"
ra-tls = { path = "../../crates/ra-tls" }
rustls-native-certs = "0.8"
rustix = "1"
chrono = "0.4"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
regex-automata = "0.4"
regex-syntax = "0.8"
rand_regex = "0.18"
rama-core = "=0.3.0-alpha.4"
rama-http = "=0.3.0-alpha.4"
rama-http-backend = { version = "=0.3.0-alpha.4", features = ["tls"] }
rama-net = { version = "=0.3.0-alpha.4", features = ["http","tls"] }
rama-socks5 = "=0.3.0-alpha.4"
rama-tcp = { version = "=0.3.0-alpha.4", features = ["http"] }
rama-tls-rustls = { version = "=0.3.0-alpha.4", features = ["http"] }

rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"


[target.'cfg(target_family = "unix")'.dependencies]
rama-unix = "=0.3.0-alpha.4"

[target.'cfg(target_os = "macos")'.dependencies]
rama-dns = "=0.3.0-alpha.4"
security-framework = "3"

[target.'cfg(windows)'.dependencies]
schannel = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
