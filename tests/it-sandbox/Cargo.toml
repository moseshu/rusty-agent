[package]
name = "it-sandbox"
description = "ra-sandbox 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-core = { path = "../../crates/ra-core" }
ra-sandbox = { path = "../../crates/ra-sandbox", features = ["docker", "http-sink"] }
async-trait = "0.1"
futures = "0.3"
rstest = "0.23"
serde_json = "1"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "bzip2", "lzma"] }
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "net"] }
# 终端附着测试：进程内的假 daemon 走 Unix socket、TCP 与 TLS，TLS 一侧用这几项做服务端。
# 都已在锁文件里（bollard 与 reqwest 的依赖树），不引入新的 crate。
bollard = "0.21"
# Reproduce workspace feature unification even when this test host runs on its own.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
