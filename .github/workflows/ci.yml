# R0-6 的门禁。
#
# 分三个 job：编译期检查、xtask 八条门禁、依赖审计。三者互不阻塞，一次 push
# 能同时看到三类问题，不用修一条再等一轮。
#
# 注意：行为测试位于独立的 tests/ workspace，该目录不进版本库，因此 CI 跑不到
# 测试——`cargo xtask all` 里的 test 一条会如实报 SKIP，本地用 `cargo xtask test`。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链由 rust-toolchain.toml 固定（1.97.1 + rustfmt/clippy），
      # rustup 在首次调用 cargo 时自动安装，无需额外 action。
      - name: 工具链版本
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      # workspace.lints 已 deny unwrap_used / dbg_macro，
      # 这里再把所有 warning 提升为错误，含 missing_docs 与 clippy::pedantic。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 编译
        run: cargo check --workspace --all-targets

  gates:
    name: xtask 八条门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # 只有 FAIL 让这一步变红；被测对象尚未存在的几条报 SKIP 并在汇总里计数，
      # 每次 CI 输出都会提醒还欠几条。
      - name: 八条门禁
        run: cargo xtask all

  deny:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用官方 action 而不是 cargo install：后者每次 CI 都要重新编译。
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
