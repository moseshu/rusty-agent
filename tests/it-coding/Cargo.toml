[package]
name = "it-coding"
description = "ra-coding 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Skill catalogs accept validated host overrides independently of compaction defaults.
ra-context = { path = "../../crates/ra-context" }
ra-core = { path = "../../crates/ra-core" }
ra-coding = { path = "../../crates/ra-coding", features = ["test-api"] }
ra-exec = { path = "../../crates/ra-exec" }
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
thiserror = "2"
tempfile = "3"
async-trait = "0.1"
futures = "0.3"
ra-prompt = { path = "../../crates/ra-prompt" }
ra-runtime = { path = "../../crates/ra-runtime" }
ra-tools = { path = "../../crates/ra-tools" }
ra-patch = { path = "../../crates/ra-patch" }
ra-execpolicy = { path = "../../crates/ra-execpolicy" }
ra-protocol = { path = "../../crates/ra-protocol" }
ra-model = { path = "../../crates/ra-model", features = ["anthropic"] }
wiremock = "0.6"

ra-sandbox = { path = "../../crates/ra-sandbox" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
