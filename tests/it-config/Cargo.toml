[package]
name = "it-config"
description = "Integration tests for shared product configuration values."
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ra-config = { path = "../../crates/ra-config", features = ["test-api"] }
ra-paths = { path = "../../crates/ra-paths" }
serde_json = "1"
toml = "0.9.5"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
ra-filesystem = { path = "../../crates/ra-filesystem" }

[dev-dependencies]
base64 = "0.22"
ra-execpolicy = { path = "../../crates/ra-execpolicy" }
dirs = "6"
test-case = "3"
toml_edit = "0.24.0"
