[package]
name = "it-runtime"
description = "ra-runtime 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-core = { path = "../../crates/ra-core" }
ra-context = { path = "../../crates/ra-context" }
ra-runtime = { path = "../../crates/ra-runtime" }
ra-tools = { path = "../../crates/ra-tools" }
# `docker` for the parity suite, which drives the runner against a real daemon as well as the local
# backend.
ra-sandbox = { path = "../../crates/ra-sandbox", features = ["docker"] }
ra-patch = { path = "../../crates/ra-patch" }
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
