[package]
name = "it-eval"
description = "ra-eval 的集成测试宿主。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-session = { path = "../../crates/ra-session" }
tempfile = "3"
ra-core = { path = "../../crates/ra-core" }
ra-model = { path = "../../crates/ra-model" }
ra-runtime = { path = "../../crates/ra-runtime" }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
ra-eval = { path = "../../crates/ra-eval" }
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"

