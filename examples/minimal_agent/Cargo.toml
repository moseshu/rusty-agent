[package]
name = "minimal_agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Deliberately only these two framework crates. See the module docs in `src/main.rs`: the point of
# this example is that a third party can build a working agent without any reference product, and
# an added dependency here is the first sign that something leaked out of the kernel.
ra-core = { path = "../../crates/ra-core" }
ra-runtime = { path = "../../crates/ra-runtime" }

async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
