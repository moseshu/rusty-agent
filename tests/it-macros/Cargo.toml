[package]
name = "it-macros"
description = "ra-macros 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-core = { path = "../../crates/ra-core" }
ra-macros = { path = "../../crates/ra-macros" }
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
