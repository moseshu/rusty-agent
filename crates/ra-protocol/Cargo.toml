[package]
name = "ra-protocol"
description = "双向控制协议、transport、app-server。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 只给 tests/ workspace 用：transport 的入站分发（队列满时回过载错误、答复等待而不丢）从公开入口
# 构造不出「出站队列也满」的情形，这扇门只转出那一个私有函数。app server 的出站路由要对容量、能否
# 断开都由测试掌握的写队列测，所以另转出 `ConnectionOpened` 的构造；服务端尚无自己的通知，测试经
# `server::test_api::ServerNotifier` 发通知。
test-api = []

[dependencies]
ra-core = { workspace = true }
ra-session = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
constant_time_eq = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }
