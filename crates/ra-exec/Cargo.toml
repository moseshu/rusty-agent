[package]
name = "ra-exec"
description = "进程执行、后台 job、沙箱隔离。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Only this crate permits a reviewed local unsafe exception.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
# 后端 feature 可叠加。**默认开原生后端**：`seatbelt` 与 `bwrap` 在 `sandbox.rs` 里
# 各自再由 `target_os` 门一层，所以 macOS 与 Linux 的默认构建都拿得到真沙箱，另一
# 边的 feature 只是空开关。`default = []` 会让默认构建静默退化成只有 unix_local，
# 对一个执行任意命令的 crate，"默认更安全"要压过"默认更好编译"。
# `docker` 依赖外部 daemon，保持显式 opt-in。
default = ["seatbelt", "bwrap"]
seatbelt = []
bwrap = []
docker = []

[dependencies]
ra-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
cap-std = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
