[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# 跟着锁文件里真实需要的最低版本走：`time` 0.3.47（RUSTSEC-2026-0009 的修复版）
# 要求 1.88。工具链固定在 1.97.1，这个下限只对下游消费者有意义。
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/moseshu/rusty-agent"
authors = ["moses"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# --- 内部 crate ---
ra-core = { path = "crates/ra-core", version = "0.2.0" }
ra-macros = { path = "crates/ra-macros", version = "0.2.0" }
ra-model = { path = "crates/ra-model", version = "0.2.0" }
ra-prompt = { path = "crates/ra-prompt", version = "0.2.0" }
ra-context = { path = "crates/ra-context", version = "0.2.0" }
ra-runtime = { path = "crates/ra-runtime", version = "0.2.0" }
ra-session = { path = "crates/ra-session", version = "0.2.0" }
ra-exec = { path = "crates/ra-exec", version = "0.2.0" }
ra-sandbox = { path = "crates/ra-sandbox", version = "0.2.0" }
ra-mcp = { path = "crates/ra-mcp", version = "0.2.0" }
ra-protocol = { path = "crates/ra-protocol", version = "0.2.0" }
ra-eval = { path = "crates/ra-eval", version = "0.2.0" }
ra-patch = { path = "crates/ra-patch", version = "0.2.0" }
ra-tools = { path = "crates/ra-tools", version = "0.2.0" }
ra-coding = { path = "crates/ra-coding", version = "0.2.0" }

# --- 运行时 ---
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "sync",
    "time",
    "io-util",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
base64 = "0.22"
cap-std = "4.0.2"
# 用 `flock`（ra-session）与进程组信号（ra-exec）。选 rustix 而不是 libc 直调，是因为
# workspace 里 `unsafe_code = "forbid"`，而它已经作为传递依赖在锁文件里了，不新增第三方
# 代码面。`process` 是取消契约要的那一半：只杀 leader 会留下孤儿，`kill_process_group`
# 才能让 SIGTERM → 宽限期 → SIGKILL 落到整个进程组。
rustix = { version = "1", features = ["fs", "process"] }
# `doctor sandbox` 要一个不可预测名字、0o700、随句柄删除的目录：它拿自己造的目录当靶子，
# 而可预测的路径在共享 /tmp 上既能被抢先创建，也不能拿去做递归删除。
tempfile = "3"
# 沙箱会话的交互终端（unix-local 的 PTY）。子进程要在 fork 与 exec 之间 `setsid`、把终端设为
# 控制终端、并把 SIGINT/SIGQUIT 复位为默认——上游 `unix_local.py` 的 `_preexec` 就是这三步。
# 这只能在 `pre_exec` 里做，而 workspace 禁止 `unsafe`，所以交给这个 crate：它的子进程设置与
# 上游一致，codex 的 `utils/pty` 用的也是它的同一版本。
portable-pty = "0.9"
# 工作区归档（`persist_workspace` / `hydrate_workspace`）。上游用 Python 的 `tarfile` 在进程内
# 读写 tar，所以移植也在进程内做：调用宿主的 `tar` 会把「归档里有什么」交给一个版本和行为都
# 不由我们决定的外部程序，而成员路径的越界检查正是这一步要守的东西。
tar = "0.4"
# 解压全走纯 Rust 实现：bzip2 用 libbz2-rs-sys 后端（经特性合并也覆盖 zip 的 bzip2），xz 用
# lzma-rust2 而非绑定 liblzma 的 xz2，交叉编译到 Windows 等目标时不需要对应的 C 工具链。
flate2 = "1"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "xz"] }
zip = { version = "2.4", default-features = false, features = ["deflate", "bzip2", "lzma"] }

# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"
sha2 = "0.10"

# --- 错误与日志 ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
globset = "0.4"
regex = "1"

# --- 网络 ---
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "rustls-tls",
], default-features = false }
# Docker 沙箱后端（ra-sandbox 的 `docker` 特性）与 daemon 对话的客户端。上游用 docker-py，
# 这里是 Rust 生态里对应的 Engine API 客户端（Apache-2.0）。`ssl` 让 `DOCKER_HOST` 指向
# TLS daemon 时也能连上——docker-py 的 `from_env` 支持这一点，上游源码的注释也专门提到
# 经 TLS 连接的远端 daemon。
bollard = { version = "0.21", features = ["ssl"] }
# 终端模式的 exec 附着：bollard 0.21 按每次读取的首字节猜测输出是否带帧头，终端输出以 0／1／2
# 开头时会被误读成帧头；上游（docker-py）对终端读原始 socket。所以终端附着自己开一条连接、发同样的
# 升级请求并直接读升级后的原始流。这几项都已在 bollard 的依赖树里，不引入新的 crate。
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }

# --- 存储与进程 ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- 杂项 ---
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
httpdate = "1"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }

# --- 宏 ---
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# --- 测试 ---
insta = { version = "1", features = ["json", "redactions"] }
wiremock = "0.6"
rstest = "0.23"
