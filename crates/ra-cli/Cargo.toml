[package]
name = "ra-cli"
description = "rusty-agent 命令行入口：REPL、单命令执行、doctor。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The command line is a library with a thin binary in front of it. `main.rs` is unreachable from
# the test workspace, and a subcommand nobody can exercise is how a flag rots.
[lib]
name = "ra_cli"
path = "src/lib.rs"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
ra-coding = { workspace = true }
ra-protocol = { workspace = true }
ra-eval = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
