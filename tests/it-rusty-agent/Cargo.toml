[package]
name = "it-rusty-agent"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
# Renamed intentionally: both tool macros must resolve the facade without a direct ra-core edge.
agents = { package = "rusty-agent", path = "../../crates/rusty-agent" }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
wiremock = "0.6"
