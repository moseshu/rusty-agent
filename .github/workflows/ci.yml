# R0-6 的门禁。
#
# 分三个 job：编译期检查、xtask 九条门禁、依赖审计。三者互不阻塞，一次 push
# 能同时看到三类问题，不用修一条再等一轮。
#
# 注意：行为测试位于独立的 tests/ workspace（进版本库，只忽略 target/）。
# `cargo xtask all` 里的 test 一条会真跑它，feature-matrix 一条逐 crate 验
# feature 全关/全开——后者必须逐 crate，workspace 级 --no-default-features
# 不穿透 crate 之间的依赖边。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链由 rust-toolchain.toml 固定（1.97.1 + rustfmt/clippy），
      # rustup 在首次调用 cargo 时自动安装，无需额外 action。
      - name: 工具链版本
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      # workspace.lints 已 deny unwrap_used / dbg_macro，
      # 这里再把所有 warning 提升为错误，含 missing_docs 与 clippy::pedantic。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 编译
        run: cargo check --workspace --all-targets

  gates:
    name: xtask 九条门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install sandbox test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # sandbox-parity 门禁在真实 Docker daemon 上跑同一组场景。镜像在这里先拉好：
      # 仓库源不可用时应当在这一步失败，而不是混进后端行为的结果里。
      - name: Pull the Docker sandbox image
        run: docker pull python:3.14-slim

      # 只有 FAIL 让这一步变红；被测对象尚未存在的几条报 SKIP 并在汇总里计数，
      # 每次 CI 输出都会提醒还欠几条。sandbox-parity 在这里两个后端都必须真跑：
      # 缺 daemon 或镜像即 FAIL，不能退成本地那样的 SKIP。
      - name: 九条门禁
        run: cargo xtask all
        env:
          RA_SANDBOX_PARITY_REQUIRE: unix_local,docker

  deny:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用官方 action 而不是 cargo install：后者每次 CI 都要重新编译。
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
