[package]
name = "it-http"
description = "Integration tests for the outbound HTTP and WebSocket client."
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-http = { path = "../../crates/ra-http", features = ["test-api"] }
futures = "0.3"
http = "1"
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"
url = "2"
zstd = "0.14.3"
