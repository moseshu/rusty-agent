[package]
name = "it-mcp"
description = "ra-mcp 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "test-util"] }
serde_json = "1"

[dev-dependencies]
ra-coding = { path = "../../crates/ra-coding" }
ra-protocol = { path = "../../crates/ra-protocol", features = ["test-api"] }
ra-mcp = { path = "../../crates/ra-mcp", features = ["http"] }
ra-core = { path = "../../crates/ra-core" }
ra-runtime = { path = "../../crates/ra-runtime" }
ra-tools = { path = "../../crates/ra-tools" }
ra-model = { path = "../../crates/ra-model", features = ["anthropic"] }
wiremock = "0.6"
axum = "0.8"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
tokio-util = "0.7"
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "aws_lc_rs"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }
