[package]
name = "ra-network-proxy"
description = "Managed network proxy policy contracts and configuration"
rust-version.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
test = false
doctest = false

# Same as the workspace lints except `unsafe_code`: the Windows TCP attribution module needs
# reviewed local unsafe for the IP Helper and token FFI ported from Codex.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
ra-config.workspace = true
ra-paths.workspace = true
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true
globset.workspace = true
http.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
time.workspace = true
serde_json.workspace = true
base64.workspace = true
rand.workspace = true
regex.workspace = true
sha2.workspace = true
ra-tls.workspace = true
rustls-native-certs.workspace = true
rustix.workspace = true
chrono = "0.4"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
regex-automata = "0.4"
regex-syntax = "0.8"
rand_regex = "0.18"
rama-core = "=0.3.0-alpha.4"
rama-http = "=0.3.0-alpha.4"
rama-http-backend = { version = "=0.3.0-alpha.4", features = ["tls"] }
rama-net = { version = "=0.3.0-alpha.4", features = ["http","tls"] }
rama-socks5 = "=0.3.0-alpha.4"
rama-tcp = { version = "=0.3.0-alpha.4", features = ["http"] }
rama-tls-rustls = { version = "=0.3.0-alpha.4", features = ["http"] }

rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"


[target.'cfg(target_family = "unix")'.dependencies]
rama-unix = "=0.3.0-alpha.4"

[target.'cfg(target_os = "macos")'.dependencies]
rama-dns = "=0.3.0-alpha.4"
security-framework = "3"

[target.'cfg(windows)'.dependencies]
schannel = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
