[package]
name = "it-network-proxy"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ra-config = { path = "../../crates/ra-config" }
ra-paths = { path = "../../crates/ra-paths" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
globset = "0.4"
http = "1"
tracing = "0.1"
pretty_assertions = "1"
tokio = { version = "1", features = ["macros","rt","time"] }
