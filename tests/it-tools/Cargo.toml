[package]
name = "it-tools"
description = "ra-tools 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
async-trait = "0.1"
ra-core = { path = "../../crates/ra-core" }
ra-tools = { path = "../../crates/ra-tools" }
ra-exec = { path = "../../crates/ra-exec" }
ra-patch = { path = "../../crates/ra-patch" }
# The skills tests load lazy skills from a host directory, a source that lives with the backends,
# and read the spans the instrumented session records while probing for a loaded skill.
ra-sandbox = { path = "../../crates/ra-sandbox" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The custom-tool tests go through the runtime's dispatch, which owns how a failure is reported.
ra-runtime = { path = "../../crates/ra-runtime" }
base64 = "0.22"
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
tempfile = "3"
