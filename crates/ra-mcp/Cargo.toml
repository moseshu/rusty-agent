[package]
name = "ra-mcp"
description = "MCP clients (stdio/streamable HTTP) and in-process tool servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
test-api = []
default = ["stdio"]
# Process spawning uses tokio directly; the transcoding pump wraps the SDK async-rw transport.
stdio = ["dep:encoding_rs"]
http = ["dep:ra-http", "dep:http", "dep:ra-tls", "dep:reqwest", "dep:rustls", "dep:sse-stream", "rmcp/transport-streamable-http-client"]

[dependencies]
ra-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }
ra-tls = { workspace = true, optional = true }
ra-config = { workspace = true }
ra-paths = { workspace = true }
ra-core = { workspace = true }
tokio = { workspace = true }
tokio-util.workspace = true
# rmcp 3 uses reqwest 0.13. HTTP auth hooks and client factories expose it, so `client::http`
# re-exports it; the workspace's other clients keep their own HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"], optional = true }
rustls = { workspace = true, features = ["aws_lc_rs"], optional = true }
sse-stream = { version = "0.2.6", optional = true }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
sha1 = "0.10.6"
base64.workspace = true
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

encoding_rs = { version = "0.8", optional = true }
