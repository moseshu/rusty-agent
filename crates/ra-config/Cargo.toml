[package]
name = "ra-config"
description = "Shared product configuration values and composition primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Same as the workspace lints except `unsafe_code`: the platform configuration module needs
# reviewed local unsafe for the CoreFoundation and Windows FFI ported from Codex.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
test-api = []

[dependencies]
dirs = { workspace = true }
dunce = { workspace = true }
ra-core = { workspace = true }
ra-paths = { workspace = true }
base64 = { workspace = true }
regex-lite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }

tracing = { workspace = true }
tokio = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }
http = { workspace = true }
ra-filesystem = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
strum_macros = "0.28"
wildmatch = "2"
anyhow = { workspace = true }
ra-execpolicy = { workspace = true }
multimap = { workspace = true }
strum = "0.28"
futures = { workspace = true }
serde_ignored = "0.1"
serde_path_to_error = "0.1"
gethostname = "1"
[target.'cfg(unix)'.dependencies]
dns-lookup = "3"
libc = "0.2"
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
