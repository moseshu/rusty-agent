# cargo-nextest 配置（作用域是测试 workspace）。
#
# 装它的理由只有一条：这里是五十多个独立测试二进制，`cargo test` 一个个串行地起，
# 而断言本身几乎不花时间——日志里满屏 `finished in 0.00s`，时间全在进程启停上。
# nextest 跨二进制并行，这种布局收益最大。
#
# **它是 opt-in 的**：`RA_TEST_RUNNER=nextest cargo xtask test`。默认不启用的原因不是
# 性能而是可靠性——整仓跑它在这台开发机上会停在 list 阶段（枚举子进程 0% CPU 无限期
# 挂着，单个宿主则秒回），原因未查明。详见 ../README.md。

[profile.default]
# 门禁要的是"这次改动破坏了哪些契约"，不是"第一个坏的是谁"。停在第一个失败上，
# 意味着每修一条就得重跑一轮才知道还剩几条。
fail-fast = false

# 一个测试跑过 30 秒就报出来，四次之后（约两分钟）判定为挂死并终止。
# 这个仓库里最慢的用例是秒级的，真卡住时更常见的原因是等一个永远不会到的信号——
# 那种情况下无限等下去只会把 CI 拖到超时，而超时日志说不出是谁的问题。
slow-timeout = { period = "30s", terminate-after = 4 }

# 失败的用例把输出打全，通过的不打。默认只在最后汇总，得再跑一遍才看得到细节。
failure-output = "immediate"
