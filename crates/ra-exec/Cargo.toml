[package]
name = "ra-exec"
description = "进程执行、后台 job、沙箱隔离。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Native process and filesystem modules permit reviewed local unsafe exceptions.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
# 后端 feature 可叠加。**默认开原生后端**：`seatbelt` 与 `bwrap` 在 `sandbox.rs` 里
# 各自再由 `target_os` 门一层，所以 macOS 与 Linux 的默认构建都拿得到真沙箱，另一
# 边的 feature 只是空开关。`default = []` 会让默认构建静默退化成只有 unix_local，
# 对一个执行任意命令的 crate，"默认更安全"要压过"默认更好编译"。
# `docker` 依赖外部 daemon，保持显式 opt-in。
default = ["seatbelt", "bwrap"]
seatbelt = []
bwrap = ["dep:seccompiler"]
docker = []
# 只给 tests/ workspace 用：把「过不了 pub 的东西」开一扇窄门，而不是把它们设成 pub。
# 本 crate 的 Linux 沙箱里有两样东西在 macOS 上根本不编译（BPF 过滤器与它的描述符传递），
# 靠 `pub(super)` 谁都测不到；门禁里的 --all-features 会把这扇门也编译一遍。
test-api = []

[dependencies]
which = "8"
anyhow = { workspace = true }
portable-pty = { workspace = true }
regex-lite = { workspace = true }
dunce = { workspace = true }
base64 = { workspace = true }
ra-paths = { workspace = true }
ra-filesystem = { workspace = true }
ra-executor-protocol = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
ra-core = { workspace = true }
tokio = { workspace = true, features = ["net", "io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
cap-std = { workspace = true }
cap-primitives = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ra-uds = { workspace = true }
rustix = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5", optional = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security_Authorization"] }

filedescriptor = "0.8.3"
lazy_static = "1"
log = "0.4"
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = ["std", "handleapi", "jobapi", "jobapi2", "libloaderapi", "minwinbase", "processthreadsapi", "synchapi", "winbase", "wincon", "winerror", "winnt"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
