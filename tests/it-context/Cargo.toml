[package]
name = "it-context"
description = "ra-context 的集成测试。不随主 workspace 发布。"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ra-core = { path = "../../crates/ra-core" }
ra-context = { path = "../../crates/ra-context" }
insta = { version = "1", features = ["json", "redactions"] }
rstest = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
